<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온라인 보드게임 카페</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; background: #1e1a16; overflow: hidden; font-family: sans-serif; }
      #game { width: 100%; height: 100%; }
      .panel { background: rgba(30, 20, 12, 0.85); color: #f3e3c3; border-radius: 10px; font-size: 14px; line-height: 1.4; }

      /* 머리 위 이름표·말풍선·리액션 */
      #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .tag {
        position: absolute; left: 0; top: 0; width: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        height: 0;
      }
      .tag > * { flex: none; white-space: nowrap; }
      .tag .name {
        margin-bottom: 2px; padding: 1px 6px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 12px;
      }
      .tag.me .name { background: rgba(212, 173, 58, 0.9); color: #2a1a0e; }
      .tag.host .name::before { content: '👑 '; }
      .door-label {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap;
        margin: -22px 0 0 0; translate: -50% 0; padding: 1px 6px; border-radius: 6px;
        background: rgba(122, 31, 43, 0.92); color: #ffe9b0; font-size: 12px; border: 1px solid #d4ad3a;
      }
      .door-label.full { background: rgba(60, 60, 60, 0.92); color: #ddd; border-color: #888; }
      .tag .bubble {
        width: max-content; max-width: 220px; white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
        margin-bottom: 4px; padding: 5px 9px; border-radius: 10px;
        background: #fffdf5; color: #2a1a0e; font-size: 13px; text-align: center;
        box-shadow: 0 1px 0 rgba(0,0,0,.3);
      }
      .tag .playing {
        margin-bottom: 3px; padding: 2px 8px; border-radius: 8px;
        background: #2f5d50; color: #f3e3c3; font-size: 12px; border: 1px solid #4a8a77;
      }
      .tag .reaction { font-size: 22px; margin-bottom: 2px; animation: pop .25s ease-out; }
      .tag [hidden] { display: none; }
      @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }

      #hud {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; gap: 10px; align-items: center; padding: 8px 14px;
        white-space: nowrap; pointer-events: none;
      }
      #stand-btn, #notice-btn {
        pointer-events: auto; cursor: pointer; padding: 4px 12px; border: 0; border-radius: 6px;
        background: #d4ad3a; color: #2a1a0e; font: bold 14px sans-serif;
      }
      #menu-btn { pointer-events: auto; cursor: pointer; padding: 4px 12px; border: 1px solid #d4ad3a; border-radius: 6px;
        background: transparent; color: #d4ad3a; font: bold 14px sans-serif; }
      #stand-btn[hidden], #menu-btn[hidden], #notice[hidden], #games[hidden],
      #room-bar[hidden], #kiosk[hidden], #game-panel[hidden], #game-modal[hidden], #delegate[hidden], #toast[hidden],
      #room-bar button[hidden] { display: none; }

      /* 알림 토스트 */
      #toast {
        position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 20;
        padding: 10px 16px; border-radius: 10px; background: #fffdf5; color: #2a1a0e; font-size: 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,.4);
      }

      /* 단체 게임방: 위쪽 방 정보 줄 */
      #room-bar {
        position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
        display: flex; gap: 8px; align-items: center; padding: 6px 10px; white-space: nowrap;
      }
      #room-info { margin-right: 4px; }
      #room-bar button, .gp-btn {
        cursor: pointer; padding: 4px 10px; border: 1px solid #d4ad3a; border-radius: 6px;
        background: transparent; color: #d4ad3a; font: bold 13px sans-serif;
      }
      #room-bar #leave-btn { background: #d4ad3a; color: #2a1a0e; }

      /* 공통 모달 */
      .modal {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6); padding: 16px; z-index: 10; outline: none;
      }
      .modal .panel { width: 100%; max-width: 480px; padding: 20px; background: #2a1a0e; border: 2px solid #6e4a2d; }
      .modal h2 { margin: 0 0 4px; font-size: 19px; }
      .modal p { margin: 0 0 14px; font-size: 13px; color: #c9b48f; }
      .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
      .modal .actions button, #delegate-list button {
        cursor: pointer; padding: 7px 16px; border: 0; border-radius: 6px; background: #4a3322; color: #f3e3c3; font: bold 14px sans-serif;
      }
      .modal .actions .primary { background: #d4ad3a; color: #2a1a0e; }

      /* 키오스크 메뉴판 */
      #kiosk-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
      .kiosk-game {
        display: flex; gap: 8px; align-items: center; padding: 10px 12px;
        border: 1px solid #6e4a2d; border-radius: 8px; background: #3a2717;
      }
      .kiosk-game.voted { border-color: #d4ad3a; }
      .kiosk-game.playing { box-shadow: inset 0 0 0 2px #4a8a77; }
      .kiosk-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .kiosk-name b { font-size: 15px; }
      .kiosk-name small { color: #d4ad3a; }
      .kiosk-name .voters { font-size: 12px; color: #a8936f; white-space: normal; }
      .kiosk-game button { cursor: pointer; padding: 6px 10px; border-radius: 6px; font: bold 13px sans-serif; }
      .vote-btn { border: 1px solid #d4ad3a; background: transparent; color: #d4ad3a; }
      .play-btn { border: 0; background: #4a8a77; color: #fff; }
      #kiosk-list .empty { margin: 0; }

      /* 게임·초대 공유 칸 */
      #game-panel {
        position: fixed; right: 16px; bottom: 16px; width: 260px; padding: 12px;
        display: flex; flex-direction: column; gap: 8px; z-index: 5;
      }
      #game-panel .gp-title { font-weight: bold; font-size: 15px; }
      #game-panel p { margin: 0; font-size: 12px; color: #c9b48f; }
      #game-panel .muted { color: #a8936f; }
      #game-panel button {
        cursor: pointer; padding: 6px 10px; border: 1px solid #d4ad3a; border-radius: 6px;
        background: transparent; color: #d4ad3a; font: bold 13px sans-serif;
      }
      #game-panel .gp-open { background: #d4ad3a; color: #2a1a0e; }
      #game-panel .gp-end { border-color: #6e4a2d; color: #c9b48f; font-weight: normal; }
      #game-panel .gp-row { display: flex; gap: 6px; }
      #game-panel input:not([type=checkbox]) {
        flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #6e4a2d; border-radius: 6px;
        background: #1e140b; color: #f3e3c3; font-size: 13px;
      }
      #game-panel .gp-code {
        padding: 8px; border-radius: 8px; background: #fffdf5; color: #2a1a0e;
        font: bold 26px monospace; text-align: center; letter-spacing: 2px; word-break: break-all;
      }
      #game-panel .gp-paste { padding: 14px; border: 2px dashed #6e4a2d; border-radius: 8px; text-align: center; font-size: 13px; outline: none; }
      #game-panel .gp-paste:focus { border-color: #d4ad3a; }
      #game-panel .gp-auto { font-size: 12px; color: #c9b48f; display: flex; gap: 6px; align-items: center; }
      #game-modal-text { font-size: 17px; margin-bottom: 4px; }
      #delegate-list { display: flex; flex-direction: column; gap: 8px; }
      #delegate-list button { text-align: left; background: #3a2717; border: 1px solid #6e4a2d; }
      #delegate-list button:hover { border-color: #d4ad3a; }
      @media (max-width: 760px) { #room-bar { top: 60px; flex-wrap: wrap; justify-content: center; white-space: normal; } #game-panel { bottom: 200px; } }

      /* 1인 게임 선택창 */
      #games {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6); padding: 16px; z-index: 10; outline: none;
      }
      #games .panel { width: 100%; max-width: 460px; padding: 20px; background: #2a1a0e; border: 2px solid #6e4a2d; }
      #games h2 { margin: 0 0 4px; font-size: 19px; }
      #games p { margin: 0 0 14px; font-size: 13px; color: #c9b48f; }
      #games-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 60vh; overflow-y: auto; }
      #games-list .game {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
        padding: 10px 12px; cursor: pointer; border: 1px solid #6e4a2d; border-radius: 8px;
        background: #3a2717; color: #f3e3c3; font: 15px sans-serif;
      }
      #games-list .game:hover { background: #4a3322; border-color: #d4ad3a; }
      #games-list .game.on { border-color: #d4ad3a; box-shadow: inset 0 0 0 1px #d4ad3a; }
      #games-list small { color: #a8936f; font-size: 11px; }
      #games .actions { display: flex; justify-content: flex-end; margin-top: 14px; }
      #games-close { cursor: pointer; padding: 7px 16px; border: 0; border-radius: 6px; background: #4a3322; color: #f3e3c3; font: bold 14px sans-serif; }
      @media (max-width: 420px) { #games-list { grid-template-columns: 1fr; } }

      #status-bar { position: fixed; left: 16px; top: 16px; padding: 6px 8px 6px 12px; display: flex; gap: 10px; align-items: center; }
      #avatar-btn {
        cursor: pointer; padding: 3px 10px; border: 1px solid #d4ad3a; border-radius: 6px;
        background: transparent; color: #d4ad3a; font: 13px sans-serif;
      }
      #avatar-btn[hidden] { display: none; }

      /* 아바타 설정창 */
      #avatar {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.7); margin: 0; padding: 16px; z-index: 10;
      }
      #avatar[hidden] { display: none; }
      #avatar .box {
        display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center;
        max-width: 560px; padding: 24px; background: #2a1a0e; border: 2px solid #6e4a2d;
      }
      #avatar h2 { margin: 0 0 14px; font-size: 20px; }
      #avatar-preview {
        width: 96px; height: 144px; padding: 16px 24px; image-rendering: pixelated;
        background: #8b5a2b; border: 3px solid #5c3b23; border-radius: 8px;
      }
      #avatar .fields { display: flex; flex-direction: column; gap: 14px; min-width: 260px; }
      #avatar label { display: block; margin-bottom: 6px; font-size: 13px; color: #c9b48f; }
      #avatar-gender { display: flex; gap: 8px; }
      #avatar-gender button {
        flex: 1; padding: 6px; cursor: pointer; border: 1px solid #6e4a2d; border-radius: 6px;
        background: #3a2717; color: #f3e3c3; font: 14px sans-serif;
      }
      #avatar-gender button.on { background: #d4ad3a; color: #2a1a0e; border-color: #d4ad3a; font-weight: bold; }
      #avatar .name-row { display: flex; gap: 6px; }
      #avatar-name {
        flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #6e4a2d; border-radius: 6px;
        background: #1e140b; color: #f3e3c3; font-size: 14px;
      }
      #avatar-random { cursor: pointer; padding: 0 10px; border: 1px solid #6e4a2d; border-radius: 6px; background: #3a2717; font-size: 16px; }
      #avatar-colors { display: grid; grid-template-columns: repeat(6, 30px); gap: 8px; }
      #avatar-colors button { width: 30px; height: 30px; cursor: pointer; border: 2px solid #1e140b; border-radius: 50%; }
      #avatar-colors button.on { outline: 3px solid #fff; outline-offset: 1px; }
      #avatar-error { min-height: 1em; color: #ff9b8a; font-size: 13px; }
      #avatar .actions { display: flex; gap: 8px; justify-content: flex-end; }
      #avatar .actions button { cursor: pointer; padding: 7px 16px; border: 0; border-radius: 6px; font: bold 14px sans-serif; }
      #avatar-submit { background: #d4ad3a; color: #2a1a0e; }
      #avatar-cancel { background: #4a3322; color: #f3e3c3; }
      #avatar-cancel[hidden] { display: none; }
      #reactions { position: fixed; right: 16px; top: 16px; padding: 8px 12px; font-size: 13px; }

      #chat { position: fixed; left: 16px; bottom: 16px; width: 280px; padding: 8px; }
      #chat-log { max-height: 160px; overflow-y: auto; margin-bottom: 6px; font-size: 13px; }
      #chat-log .mine b { color: #d4ad3a; }
      #chat-log b { color: #9fd0ff; }
      #chat-input {
        width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #6e4a2d; border-radius: 6px;
        background: #2a1a0e; color: #f3e3c3; font-size: 14px;
      }

      #notice {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.7);
      }
      #notice .panel { padding: 24px 28px; text-align: center; font-size: 16px; background: #2a1a0e; }
      #notice-text { white-space: pre-line; margin-bottom: 16px; }

      /* 좁은 화면에서는 리액션 안내를 숨긴다 */
      @media (max-width: 760px) { #reactions { display: none; } #chat { width: calc(100% - 32px); bottom: 70px; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="tags"></div>
    <div id="status-bar" class="panel">
      <span id="status"></span>
      <button id="avatar-btn" hidden>아바타 변경</button>
    </div>
    <div id="reactions" class="panel"></div>
    <div id="chat" class="panel">
      <div id="chat-log"></div>
      <input id="chat-input" maxlength="100" placeholder="Enter 눌러 채팅" autocomplete="off" />
    </div>
    <div id="hud" class="panel">
      <span id="hint">방향키/WASD 이동</span>
      <button id="menu-btn" hidden>게임 고르기</button>
      <button id="stand-btn" hidden>서기</button>
    </div>
    <div id="notice" hidden>
      <div class="panel">
        <div id="notice-text"></div>
        <button id="notice-btn"></button>
      </div>
    </div>
    <div id="toast" hidden></div>
    <div id="room-bar" class="panel" hidden>
      <span id="room-info"></span>
      <button id="kiosk-btn">🗳 메뉴판</button>
      <button id="lock-btn" hidden>🔒 방문 잠그기</button>
      <button id="disband-btn" hidden>해산</button>
      <button id="leave-btn">나가기</button>
    </div>
    <div id="game-panel" class="panel" hidden></div>
    <div id="kiosk" class="modal" tabindex="-1" hidden>
      <div class="panel">
        <h2>🗳 단체 게임 메뉴판</h2>
        <p id="kiosk-desc"></p>
        <div id="kiosk-list"></div>
        <div class="actions"><button type="button" id="kiosk-close">닫기</button></div>
      </div>
    </div>
    <div id="game-modal" class="modal" tabindex="-1" hidden>
      <div class="panel">
        <h2 id="game-modal-text"></h2>
        <p>버튼을 누르면 새 탭에서 게임이 열려요.</p>
        <div class="actions">
          <button type="button" id="game-modal-close">나중에</button>
          <button type="button" id="game-modal-open" class="primary">🎲 게임 열기</button>
        </div>
      </div>
    </div>
    <div id="delegate" class="modal" tabindex="-1" hidden>
      <div class="panel">
        <h2>👑 다음 방장 고르기</h2>
        <p>방장이 나가려면 다음 방장을 정해야 해요.</p>
        <div id="delegate-list"></div>
        <div class="actions"><button type="button" id="delegate-cancel">취소 (방에 남기)</button></div>
      </div>
    </div>
    <div id="games" tabindex="-1" hidden>
      <div class="panel">
        <h2>🎲 혼자 할 게임 고르기</h2>
        <p>고르면 새 탭에서 열리고, 머리 위에 "하는 중"이 표시돼요.</p>
        <div id="games-list"></div>
        <div class="actions"><button type="button" id="games-close">그냥 앉아 있기</button></div>
      </div>
    </div>
    <form id="avatar" hidden>
      <div class="box panel">
        <canvas id="avatar-preview" width="96" height="144"></canvas>
        <div class="fields">
          <h2 id="avatar-title">아바타 만들기</h2>
          <div>
            <label>성별</label>
            <div id="avatar-gender">
              <button type="button" data-gender="male">남</button>
              <button type="button" data-gender="female">여</button>
            </div>
          </div>
          <div>
            <label for="avatar-name">이름</label>
            <div class="name-row">
              <input id="avatar-name" autocomplete="off" />
              <button type="button" id="avatar-random" title="랜덤 이름">🎲</button>
            </div>
          </div>
          <div>
            <label>옷 색</label>
            <div id="avatar-colors"></div>
          </div>
          <div id="avatar-error"></div>
          <div class="actions">
            <button type="button" id="avatar-cancel">취소</button>
            <button type="submit" id="avatar-submit">입장하기</button>
          </div>
        </div>
      </div>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
